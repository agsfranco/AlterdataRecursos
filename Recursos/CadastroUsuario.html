    <div id="body">
        <ul id="usuarios"></ul>
    </div>
    <form id="form1" method="post" action="http://localhost:56648/api/usuario" >
        <h3>Criar novo Usuario</h3>
        <p>
            <label id="usuarioNome">Nome:</label>
            <input type="text" name="nome" />
        </p>
        <p>
            <label id="usuarioEmail">Email:</label>
            <input type="text" name="email" />
        </p>
        <p>
            <label id="usuarioSenha">Senha:</label>
            <input type="text" name="senha" />
        </p>
        <input type="submit" id="saveUsuario" value="Save" />
    </form>

    <script type="text/javascript">
        $('#form2').submit(function () {
            var jqxhr = $.post('http://localhost:56648/api/usuario',
                {
                    "nome": $('#usuarioNome').val(),
                    "email": $('#usuarioEmail').val(),
                    "senha": $('#usuarioSenha').val()
                }).success(function (item) {
                    $('#usuarios').append('<li>' + item.id + item.nome + item.email + '</li>');
                })
                .error(function () {
                    $('#message').html("Error posting the update.");
                });
            alert(jqxhr);
            return false;
        });





        $("#form1").submit(function () {
            var jqxhr = $.post('http://localhost:56648/api/usuario', $('#form1').serialize())
                .success(function (item) {
                    $('#usuarios').append('<li>' + item.id + item.nome + item.email + '</li>');
                })
                .error(function () {
                    $('#message').html("Error posting the update.");
                });
            return false;
        });
    </script>
